name: "💭 Question"
description: Ask a question about the project
title: "[💭]: "
labels:
  - question
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to ask a question.
        Please provide as much detail as possible.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Write your question here. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context (Optional)
      description: Add any details, screenshots, or references that could help.
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: Steps Taken (Optional)
      description: If applicable, let us know what you have tried so far.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked [existing issues](https://github.com/rstanziale/devctl/issues) to make sure this question was not already answered.
          required: true
