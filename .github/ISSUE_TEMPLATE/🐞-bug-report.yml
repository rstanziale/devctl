name: "🐞 Bug report"
description: Create a report to help us improve
title: "[🐞]: "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.

  - type: textarea
    id: bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: "Example: Windows 11, macOS 14, Ubuntu 24.04"
      placeholder: Windows 11
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: "Example: 1.23.1"
      placeholder: 1.23.1
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
