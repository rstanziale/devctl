name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install deps
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...
