name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          EXISTING_SHA=$(git rev-parse --verify "refs/tags/$VERSION^{commit}" 2>/dev/null || true)

          if [ -z "$EXISTING_SHA" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag -a "$VERSION" "$MERGE_SHA" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          elif [ "$EXISTING_SHA" != "$MERGE_SHA" ]; then
            echo "::error::Tag $VERSION already exists and points to a different commit ($EXISTING_SHA), refusing to move it."
            exit 1
          else
            echo "Tag $VERSION already points to $MERGE_SHA, nothing to do."
          fi

      - name: Publish Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
