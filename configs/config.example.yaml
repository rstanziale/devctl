# yaml-language-server: $schema=./config.schema.json
version: 1
workspace: D:\Workspace\GitHub\test
concurrency_mode: parallel

healthchecks:
  - name: GitHub
    url: https://github.com/
    type: http
    timeout: 2s

tools:
  - name: Git
    command: git
  - name: Node
    command: node
  - name: npm
    command: npm

repos:
  - name: Octo Template
    url: https://github.com/octo-org/octo-template
    dir: Tools
    gitflow: false

tasks:
  - name: build-fe
    mode: parallel
    subtasks:
      - name: app-fe-1
        dir: /dir/app-1
        commands:
          - npm install
          - npm run build
      - name: app-fe-2
        dir: /dir/app-2
        commands:
          - npm install
          - npm run build

settings:
  ai:
    enabled: true
    engine: ollama
    ollama:
      model: gemma4
      base_url: http://localhost:11434
      timeout: 30m
